name: test

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path contract/Cargo.toml -- --test-threads=8
        env:
          CARGO_BUILD_JOBS: "1"
