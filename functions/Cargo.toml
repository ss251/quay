[workspace]
resolver = "2"
members = ["quay-fn", "preview", "moderate", "digest", "relay"]

[workspace.dependencies]
quay-fn = { path = "quay-fn" }
serde_json = "1.0"

# Every byte is fetched by an OutLayer worker on each cold start: keep wasm small.
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
