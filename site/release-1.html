<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quay release 1</title>
  <meta name="quay-release" content="1">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, #f4efe4 0%, #e7e1d4 42%, #d5cbb8 100%);
      color: #1c1915;
      font: 18px/1.45 Palatino, "Iowan Old Style", Palatino Linotype, Georgia, serif;
    }
    main {
      width: min(38rem, calc(100% - 2rem));
      margin: 8vh auto;
      padding: 1.6rem 1.5rem 1.4rem;
      background: #f7f3ea;
      border: 1px solid #1c1915;
      box-shadow: 8px 8px 0 #1c1915;
    }
    .seal {
      width: 4.2rem;
      height: 4.2rem;
      border-radius: 50%;
      background: #9d2c22;
      color: #f7f3ea;
      display: grid;
      place-items: center;
      font: 700 0.78rem/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      letter-spacing: 0.08em;
      transform: rotate(-8deg);
    }
    h1 { margin: 1rem 0 0.3rem; font-size: 2.4rem; font-weight: 600; letter-spacing: -0.03em; }
    p { margin: 0.4rem 0; }
    .id { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 0.95rem; }
    a { color: inherit; }
    footer { margin-top: 1.4rem; color: #5c564c; font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <div class="seal">SEALED</div>
    <h1>release 1</h1>
    <p>This page is sealed. Promoting a later release does not change these bytes.</p>
    <p class="id">quay-bb.testnet · /r/1</p>
    <footer><a href="/">Production</a> is a pointer. This URL stays.</footer>
  </main>
</body>
</html>
