name: Preview

on:
  workflow_dispatch:
  push:
    paths:
      - "examples/harbour/**"
      - "action/**"
      - "cli/**"

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Harbour
        working-directory: examples/harbour
        run: npm install && npm run build
      - name: Deploy a preview
        uses: ./action
        env:
          QUAY_ACCOUNT: ${{ secrets.QUAY_ACCOUNT }}
          QUAY_CI_KEY: ${{ secrets.QUAY_CI_KEY }}
        with:
          directory: examples/harbour/dist
          message: harbour preview
