[package]
name = "quay-mock"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Sandbox stand-ins: an OutLayer request_execution and a minimal NEP-141 token."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = "symbols"
