[package]
name = "quay-sandbox"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Sandbox tests for the Quay contract. They deploy cli/vendor/quay.wasm."

[dev-dependencies]
near-sandbox = "0.4"
near-api = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
testresult = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"
